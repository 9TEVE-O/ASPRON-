name: ASPRON tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lifecycle-fail-closed:
    name: Lifecycle and fail-closed tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ASPRON lifecycle/fail-closed tests
        run: node tests/lifecycle-fail-closed.test.js

      - name: Run Capsule 001 Safe Summary Gate tests
        run: node tests/capsule-001-safe-summary-gate.test.js

      - name: Run receipt integrity boundary tests
        run: node tests/receipt-integrity-boundary.test.js

      - name: Run Capsule 001 receipt boundary tests
        run: node tests/capsule-001-receipt-boundary.test.js

      - name: Run Capsule 001 UI boundary tests
        run: node tests/capsule-001-ui-boundary.test.js

      - name: Run durable assurance control plane tests
        run: node tests/assurance-control-plane.test.js

      - name: Run security boundary regression tests
        run: node tests/security-boundary-regressions.test.js
